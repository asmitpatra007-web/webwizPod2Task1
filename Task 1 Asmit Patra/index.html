<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK-PAPER-SCISSORS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: rgb(209, 215, 173);">
    <h1>
        ROCK &nbsp; PAPER &nbsp; SCISSOR
    </h1>
    <div class="my_choices" >
        <div class="choice" id="rock">
            <img src="rock-emoji.png" alt="">
        </div>
        <div class="choice" id="paper">
            <img src="paper-emoji.png" alt="">
        </div>
        <div class="choice" id="scissor">
            <img src="scissors-emoji.png" alt="">
        </div>
    </div>

    <div class="score_board">
        <div class="score">
            <p>YOU</p>
            <p id="your_score">0</p>
        </div>
        <div class="score">
            <p>COMP</p>
            <p id="comp_score">0</p>
        </div>
    </div>

    <div class="result_container">
        <p id="result">play your move</p>
    </div>

    <script src="game.js"></script>
</body>

</html>
